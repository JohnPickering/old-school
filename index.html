<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Old School PDF</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            font-family: 'Chalkboard SE', 'Comic Sans MS', 'Comic Sans', cursive; 
            display: flex; flex-direction: column; overflow: hidden;
            background-color: #2d5a27; /* Chalkboard Green */
            color: white;
        }

        .header {
            padding: 10px 20px; 
            background: rgba(0, 0, 0, 0.2); 
            display: flex;
            justify-content: space-between; 
            align-items: center;
            border-bottom: 2px solid rgba(255, 255, 255, 0.3);
        }

        #pageTitle {
            margin: 0;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 2px;
            color: white;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 15px;
            color: white;
        }

        select, button {
            padding: 8px 15px; font-size: 14px; cursor: pointer;
            font-family: inherit; 
        }

        #saveBtn {
            background-color: #fdfdfd; color: #2d5a27; border: none; border-radius: 4px;
            font-weight: bold;
            transition: background 0.2s ease;
        }

        #saveBtn:hover { background-color: #cccccc; }

        .text-container { 
            flex-grow: 1; 
            display: flex; 
            padding: 30px; 
            box-sizing: border-box; 
            justify-content: center;
        }

        #textBox {
            width: 100%; 
            height: 100%; 
            padding: 40px; 
            font-size: 18px;
            background-color: white; 
            color: black;
            font-family: 'Times New Roman', Times, serif;
            border: 1px solid #ccc; 
            border-radius: 2px; 
            resize: none; 
            box-sizing: border-box; outline: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        #textBox:focus { border-color: #999; }

        .footer {
            padding: 5px 20px;
            text-align: right;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
            background: rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 id="pageTitle">OLD SCHOOL</h1>
        <div class="controls">
            <div style="display: flex; align-items: center; gap: 5px;">
                <label for="pageSize">Page Size: </label>
                <select id="pageSize">
                    <option value="a4">A4</option>
                    <option value="letter">US Letter</option>
                </select>
            </div>
            <button id="saveBtn">Save As...</button>
        </div>
    </div>

    <div class="text-container">
        <textarea 
            id="textBox" 
            placeholder="Begin typing your assignment..."
            spellcheck="false" 
            autocorrect="off" 
            autocomplete="off" 
            autocapitalize="off">
        </textarea>
    </div>

    <div class="footer">
        (c) John W. Pickering, 2026
    </div>

    <script>
        const textBox = document.getElementById('textBox');
        const saveBtn = document.getElementById('saveBtn');
        const pageSizeSelect = document.getElementById('pageSize');

        saveBtn.addEventListener('click', async () => {
            const { jsPDF } = window.jspdf;
            
            const format = pageSizeSelect.value; 
            const doc = new jsPDF({ format: format });
            
            // --- PDF FONT SETTINGS ---
            doc.setFont("times", "normal"); // Sets font to Times New Roman equivalent
            doc.setFontSize(12);           // Sets size to 12 point
            
            const text = textBox.value;
            if (!text) { alert("The box is empty!"); return; }

            const margin = 10;
            const pageWidth = doc.internal.pageSize.getWidth();
            const pageHeight = doc.internal.pageSize.getHeight();
            const maxLineWidth = pageWidth - (margin * 2);
            const splitText = doc.splitTextToSize(text, maxLineWidth);
            
            let cursorY = margin;
            const lineSpacing = 7; // Slightly adjusted for 12pt font

            for (let i = 0; i < splitText.length; i++) {
                if (cursorY > pageHeight - 30) { 
                    doc.addPage();
                    cursorY = margin;
                }
                doc.setTextColor(0, 0, 0);
                doc.text(splitText[i], margin, cursorY);
                cursorY += lineSpacing;
            }

            const now = new Date();
            const timestamp = `An Old School pdf generated on ${now.toLocaleString()}`;
            const totalPages = doc.internal.getNumberOfPages();
            for (let i = 1; i <= totalPages; i++) {
                doc.setPage(i);
                
                // Footer Font Settings
                doc.setFontSize(10); // Smaller font for footer elements
                
                doc.setTextColor(255, 255, 255); 
                doc.text(timestamp, margin, pageHeight - 10);
                
                doc.setTextColor(0, 0, 0);        
                doc.text(`Page ${i} of ${totalPages}`, pageWidth - 30, pageHeight - 10);
            }

            try {
                if ('showSaveFilePicker' in window) {
                    const handle = await window.showSaveFilePicker({
                        suggestedName: 'Old_school_Assignment.pdf',
                        types: [{
                            description: 'PDF Document',
                            accept: {'application/pdf': ['.pdf']},
                        }],
                    });
                    const writable = await handle.createWritable();
                    const pdfBlob = doc.output('blob');
                    await writable.write(pdfBlob);
                    await writable.close();
                } else {
                    doc.save("Old_school_Assignment.pdf");
                }
            } catch (err) {
                console.log("Save cancelled or browser does not support picker.");
            }
        });
    </script>
</body>
</html>
