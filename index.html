<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Old School PDF</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            font-family: 'Chalkboard SE', 'Comic Sans MS', 'Comic Sans', cursive; 
            display: flex; flex-direction: column; overflow: hidden;
            background-color: #2d5a27; color: white;
        }
        .header {
            padding: 10px 20px; background: rgba(0, 0, 0, 0.2); 
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid rgba(255, 255, 255, 0.3);
        }
        #pageTitle { margin: 0; font-size: 28px; font-weight: bold; letter-spacing: 2px; color: white; }
        .controls { display: flex; align-items: center; gap: 15px; color: white; }
        select, button { padding: 8px 15px; font-size: 14px; cursor: pointer; font-family: inherit; }
        #saveBtn { background-color: #fdfdfd; color: #2d5a27; border: none; border-radius: 4px; font-weight: bold; transition: background 0.2s ease; }
        #saveBtn:hover { background-color: #cccccc; }
        .text-container { flex-grow: 1; display: flex; padding: 30px; box-sizing: border-box; justify-content: center; }
        #textBox {
            width: 100%; height: 100%; padding: 40px; font-size: 18px;
            background-color: white; color: black;
            font-family: 'Times New Roman', Times, serif;
            border: 1px solid #ccc; border-radius: 2px; resize: none; 
            box-sizing: border-box; outline: none; box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }
        .footer { padding: 5px 20px; text-align: right; font-size: 14px; color: rgba(255, 255, 255, 0.8); background: rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body>

    <div class="header">
        <h1 id="pageTitle">OLD SCHOOL</h1>
        <div class="controls">
            <div style="display: flex; align-items: center; gap: 5px;">
                <label for="pageSize">Page Size: </label>
                <select id="pageSize">
                    <option value="a4">A4</option>
                    <option value="letter">US Letter</option>
                </select>
            </div> <!-- Fixed missing bracket -->
            <button id="saveBtn">Save As...</button>
        </div> <!-- Fixed missing bracket -->
    </div> <!-- Fixed missing bracket -->

    <div class="text-container">
        <textarea id="textBox" placeholder="Begin typing your assignment..." spellcheck="false" autocorrect="off" autocomplete="off" autocapitalize="off"></textarea>
    </div> <!-- Fixed missing bracket -->

    <div class="footer">(c) John W. Pickering, 2026</div> <!-- Fixed missing bracket -->

    <canvas id="flattenCanvas" style="display:none;"></canvas>

    <script>
        const textBox = document.getElementById('textBox');
        const saveBtn = document.getElementById('saveBtn');
        const pageSizeSelect = document.getElementById('pageSize');
        const canvas = document.getElementById('flattenCanvas');
        const ctx = canvas.getContext('2d');

        function getWrappedLines(ctx, text, maxWidth) {
            const paragraphs = text.split('\n'); 
            const allLines = [];

            paragraphs.forEach(paragraph => {
                const words = paragraph.split(' ');
                let currentLine = '';

                words.forEach(word => {
                    const testLine = currentLine + (currentLine ? ' ' : '') + word;
                    if (ctx.measureText(testLine).width > maxWidth) {
                        allLines.push(currentLine);
                        currentLine = word;
                    } else {
                        currentLine = testLine;
                    }
                });
                allLines.push(currentLine); 
            });
            return allLines;
        }

        saveBtn.addEventListener('click', async () => {
            const { jsPDF } = window.jspdf;
            const format = pageSizeSelect.value; 
            const doc = new jsPDF({ format: format });
            const text = textBox.value;
            if (!text) { alert("The box is empty!"); return; }

            const pageWidthMm = doc.internal.pageSize.getWidth();
            const pageHeightMm = doc.internal.pageSize.getHeight();
            const marginMm = 15; 
            
            const scale = 4; 
            const fontSizePx = 16 * scale; 
            const lineHeightPx = fontSizePx * 1.5; 
            const mmToPx = 3.78 * scale; 

            canvas.width = pageWidthMm * mmToPx;
            canvas.height = pageHeightMm * mmToPx;

            ctx.font = `${fontSizePx}px 'Times New Roman'`;
            const maxWidthPx = (pageWidthMm - (marginMm * 2)) * mmToPx;
            
            const allWrappedLines = getWrappedLines(ctx, text, maxWidthPx);
            
            let lineIndex = 0;
            let pageCount = 0;
            const contentHeightLimitPx = (pageHeightMm - (marginMm * 2)) * mmToPx;

            while (lineIndex < allWrappedLines.length) {
                pageCount++;
                ctx.fillStyle = "white";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "black";
                
                let linesOnPage = 0;
                while (lineIndex < allWrappedLines.length && (linesOnPage * lineHeightPx) < contentHeightLimitPx) {
                    const x = marginMm * mmToPx;
                    const y = (marginMm * mmToPx) + ((linesOnPage + 1) * (fontSizePx * 0.9)); 
                    ctx.fillText(allWrappedLines[lineIndex], x, y);
                    lineIndex++;
                    linesOnPage++;
                }

                const imgData = canvas.toDataURL('image/jpeg', 0.95);
                doc.addImage(imgData, 'JPEG', 0, 0, pageWidthMm, pageHeightMm);
                if (lineIndex < allWrappedLines.length) doc.addPage();
            }

            const now = new Date();
            const timestamp = `An Old School pdf generated on ${now.toLocaleString()}`;
            for (let i = 1; i <= pageCount; i++) {
                doc.setPage(i);
                doc.setFont("times", "normal");
                doc.setFontSize(10);
                doc.setTextColor(255, 255, 255); 
                doc.text(timestamp, marginMm, pageHeightMm - 10);
                doc.setTextColor(0, 0, 0);        
                doc.text(`Page ${i} of ${pageCount}`, pageWidthMm - 30, pageHeightMm - 10);
            }

            try {
                if ('showSaveFilePicker' in window) {
                    const handle = await window.showSaveFilePicker({
                        suggestedName: 'Old_school_Assignment.pdf',
                        types: [{ description: 'PDF Document', accept: {'application/pdf': ['.pdf']} }],
                    });
                    const writable = await handle.createWritable();
                    await writable.write(doc.output('blob'));
                    await writable.close();
                } else {
                    doc.save("Old_school_Assignment.pdf");
                }
            } catch (err) { console.log("Save cancelled."); }
        });
    </script> <!-- Fixed: was </ -->
</body>
</html>
